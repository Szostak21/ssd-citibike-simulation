[project]
name = "ssd-citibike-simulation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "requests>=2.31",
    "streamlit>=1.35",
    "pydeck>=0.9",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
